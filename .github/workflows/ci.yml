name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install packages
      run: |
        # Install in dependency order with --no-deps to avoid
        # PyPI lookup failures for local inter-package deps.
        # Third-party deps are pulled in by the root ".[dev]" install
        # and by explicit pip install of each package's extras below.

        # 1) Leaf packages (no local deps)
        pip install --no-deps -e packages/jay-llm
        pip install --no-deps -e packages/jay-tui

        # 2) Packages depending on jay-llm
        pip install --no-deps -e packages/jay-agent-core
        pip install --no-deps -e packages/jay-web-ui

        # 3) Packages depending on jay-llm + jay-agent-core + jay-tui
        pip install --no-deps -e packages/jay-coding-agent
        pip install --no-deps -e packages/jay-messenger

        # Install all third-party dependencies
        pip install openai anthropic pydantic rich prompt-toolkit \
          typer fastapi uvicorn jinja2 python-multipart coverage \
          httpx beautifulsoup4 tzdata cryptography redis
      shell: bash

    - name: Run linting
      shell: bash
      run: |
        ruff check packages/
        ruff format --check packages/

    - name: Run type checking (strict for hardened security/contract modules)
      shell: bash
      run: |
        # Modules with explicit strict-typing contract. New code that lands
        # here MUST stay strict-clean — these are our security/correctness
        # foundations and we don't want regression.
        mypy --strict \
          packages/jay-llm/src/jay_llm/context_window.py \
          packages/jay-coding-agent/src/jay_coding_agent/handoff.py \
          packages/jay-web-ui/src/jay_web_ui/security.py

        # Whole-package strict — currently aspirational. Remove `|| true`
        # when each package reaches strict-clean.
        mypy --strict packages/jay-llm/src || true
        mypy --strict packages/jay-agent-core/src || true

        # Loose typecheck for the rest (catches obvious errors).
        mypy packages/jay-agent-core/src packages/jay-llm/src
        mypy packages/jay-coding-agent/src packages/jay-web-ui/src || true

    - name: Run tests with coverage gate
      shell: bash
      run: |
        # Run root tests separately, then each package
        # (avoids conftest.py module name collisions across packages)
        pytest tests/ -v --cov=packages --cov-report=term
        for pkg in packages/*/; do
          if [ -d "$pkg/tests" ]; then
            pytest "$pkg/tests" -v --cov=packages --cov-append
          fi
        done

        # Generate final coverage report
        coverage xml
        coverage report

        # Gate: modules hardened in this round must stay >= 95% line
        # coverage (90% for security.py — its Linux-only branches get
        # skipped on the Windows leg of the matrix).
        # Anything dropping below those numbers means a test got deleted
        # or new uncovered branches were added — fix the tests, not the gate.
        # Globs use `*name.py` rather than full paths so they match on both
        # forward-slash (Linux) and backslash (Windows) coverage data.
        coverage report --include='*context_window.py' --fail-under=95
        coverage report --include='*handoff.py' --fail-under=95
        coverage report --include='*security.py' --fail-under=90

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build packages
      run: |
        for pkg in packages/*/; do
          if [ -f "$pkg/pyproject.toml" ]; then
            echo "Building $pkg..."
            python -m build "$pkg"
          fi
        done

    - name: Check distributions
      run: |
        twine check packages/*/dist/* || true

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check documentation
      run: |
        # Check all packages have READMEs
        for pkg in packages/*/; do
          if [ ! -f "$pkg/README.md" ]; then
            echo "Missing README in $pkg"
            exit 1
          fi
        done

        echo "✓ All packages have documentation"
