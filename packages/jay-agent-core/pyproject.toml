[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jay-agent-core"
version = "0.0.4"
description = "Agent runtime with tool calling and state management"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "hujihuji630" }
]

dependencies = [
    "jay-llm>=0.0.1",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "typing-extensions>=4.9.0",
]

[project.urls]
Homepage = "https://github.com/hujihuji630/jayclaw"
Repository = "https://github.com/hujihuji630/jayclaw"
Issues = "https://github.com/hujihuji630/jayclaw/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jay_agent_core"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]
