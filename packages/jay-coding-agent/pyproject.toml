[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jay-coding-agent"
version = "0.0.4"
description = "Interactive coding agent CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "hujihuji630" }
]

dependencies = [
    "jay-llm>=0.0.1",
    "jay-agent-core>=0.0.4",
    "jay-agent-tools>=0.0.1",
    "jay-tui>=0.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/hujihuji630/jayclaw"
Repository = "https://github.com/hujihuji630/jayclaw"
Issues = "https://github.com/hujihuji630/jayclaw/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
jay-code = "jay_coding_agent.cli:app"
claw = "jay_coding_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jay_coding_agent"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]
